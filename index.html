<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تقارير التبادل التجاري للأردن</title>
<style>
body{font-family:Arial,Tahoma,sans-serif;margin:0;background:#f7fafc;color:#153d6b}
main{max-width:980px;margin:auto;padding:40px 22px}
.card{background:#fff;border:1px solid #d9e7f3;border-radius:18px;padding:24px;box-shadow:0 8px 28px #1232}
h1{margin-top:0} a{color:#0969da;text-decoration:none} ul{line-height:2}
small{color:#6b7f94}
</style>
</head>
<body><main><div class="card">
<h1>مكتبة تقارير التبادل التجاري للأردن مع دول العالم</h1>
<p>تقارير PDF مولّدة من لوحة Power BI التابعة لغرفة تجارة عمّان لاستخدامها في منصة V36.</p>
<p id="status">جاري تحميل قائمة التقارير…</p>
<div id="lists"></div>
<small>تُحدَّث التقارير عند تحديث بيانات المنصة.</small>
</div></main>
<script>
fetch('manifest.json').then(r=>r.json()).then(m=>{
 const entries=Object.values(m.reports||{});
 const base=String(m.base_url||'').replace(/\/+$/,'');
 const reportUrl=(path)=>{
   const p=String(path||'');
   if(/^https?:\/\//i.test(p)) return p;
   return base ? base+'/'+p.replace(/^\/+/, '') : p;
 };
 document.getElementById('status').textContent='عدد الدول المتاحة: '+entries.length;
 const ar=entries.filter(x=>x.ar).map(x=>`<li><a href="${reportUrl(x.ar)}">${x.country_ar||x.country_en}</a></li>`).join('');
 const en=entries.filter(x=>x.en).map(x=>`<li><a href="${reportUrl(x.en)}">${x.country_en}</a></li>`).join('');
 document.getElementById('lists').innerHTML=`<h2>العربية</h2><ul>${ar||'<li>لا توجد تقارير بعد.</li>'}</ul><h2>English</h2><ul dir="ltr">${en||'<li>No reports yet.</li>'}</ul>`;
}).catch(()=>document.getElementById('status').textContent='تعذر قراءة قائمة التقارير.');
</script></body></html>
